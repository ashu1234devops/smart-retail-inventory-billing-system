<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Retail</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #1f2937,
                    #374151
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .login-container {

            width: 100%;

            max-width: 430px;
        }

        .login-card {

            background: white;

            border-radius: 14px;

            padding: 40px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);
        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #1f2937;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            color: #374151;

            margin-bottom: 8px;
        }

        .form-group input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;

            outline: none;
        }

        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.1);
        }

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-button:hover {

            background: #1d4ed8;
        }

        .error-message {

            background: #fee2e2;

            color: #b91c1c;

            border:
                1px solid #fecaca;

            border-radius: 7px;

            padding: 12px;

            font-size: 14px;

            margin-bottom: 20px;

            text-align: center;
        }

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #888;

            font-size: 12px;
        }

        @media (max-width: 500px) {

            .login-card {

                padding: 30px 22px;
            }

            .logo {

                font-size: 24px;
            }
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">

            🏪 SMART RETAIL

        </div>


        <div class="subtitle">

            Inventory, Billing & Profit Management System

        </div>


        {% if form.errors %}

        <div class="error-message">

            Invalid username or password.

            Please try again.

        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="id_username">

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="id_password">

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >


            <button
                type="submit"
                class="login-button"
            >

                Login

            </button>


        </form>


        <div class="footer">

            Smart Retail Management System

        </div>


    </div>


</div>


</body>

</html>
