<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Sale | Smart Retail</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 600px;
            margin: 70px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 15px;
            color: #dc2626;
        }

        p {
            margin-bottom: 25px;
            color: #555;
            line-height: 1.6;
        }

        .sale-info {
            background: #f9fafb;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button,
        a {
            padding: 11px 18px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .cancel {
            background: #e5e7eb;
            color: #333;
        }

    </style>

</head>

<body>

<header class="header">

    <div class="logo">
        🏪 SMART RETAIL
    </div>

</header>


<div class="container">

    <div class="card">

        <h1>
            Delete Sale
        </h1>

        <p>
            Are you sure you want to delete this sales invoice?
            This action cannot be undone.
        </p>


        <div class="sale-info">

            <strong>
                Invoice Number:
            </strong>

            {{ sale.sales_invoice_number }}

            <br><br>

            <strong>
                Customer:
            </strong>

            {{ sale.customer_name }}

            <br><br>

            <strong>
                Product:
            </strong>

            {{ sale.product }}

        </div>


        <div class="buttons">

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete">

                    Yes, Delete

                </button>

            </form>


            <a
                href="{% url 'sale_list' %}"
                class="cancel">

                Cancel

            </a>

        </div>

    </div>

</div>

</body>

</html>
